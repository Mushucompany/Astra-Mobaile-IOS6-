plugins {
    id 'com.android.application'
}

android {
    namespace 'com.astralauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.astralauncher"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('C:/AstraLauncher/astralauncher.keystore')
            storePassword 'astra123'
            keyAlias 'astra'
            keyPassword 'astra123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}